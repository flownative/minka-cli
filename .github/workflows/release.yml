name: Release

# Publishing a release in GitHub builds it: the archives are attached to the
# release, and the formula in the Homebrew tap is pointed at the new version.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach the archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a version and stands on main
        id: version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The tag '$TAG' is not a version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          revision="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$revision" origin/main; then
            echo "::error::The tag '$TAG' does not stand on main"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Dependencies are tidy
        run: go mod tidy -diff
      - run: make check
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build the archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dist VERSION="$VERSION"
      - name: The binary knows its version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -xzf "dist/minka_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/minka_${VERSION}_linux_amd64/minka" version --styled | grep -Fx "minka $VERSION"
      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Without --clobber: archives that are out are never replaced, so
        # running this job again for a published version fails here.
        run: gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --repo "$GITHUB_REPOSITORY"

  tap:
    name: Point the Homebrew formula at the release
    needs: build
    # A prerelease is for trying out; Homebrew only ever offers stable versions.
    # The tag counts as well as the checkbox, which is easily forgotten.
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      REVISION: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The deploy key of the tap is there
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::The secret TAP_DEPLOY_KEY is missing in the environment 'release'. The archives are attached; the formula was not written."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flownative/homebrew-flownative
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: The formula does not go back to an older version
        run: |
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Formula/minka.rb 2>/dev/null || true)"
          if [ -n "$current" ] && [ "$current" != "$VERSION" ] \
            && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$current" ]; then
            echo "::error::The tap offers $current, which is newer than $VERSION"
            exit 1
          fi
      - name: Write the formula
        run: |
          sed -e "s/{{version}}/$VERSION/g" -e "s/{{revision}}/$REVISION/g" \
            .github/formula/minka.rb.tpl > tap/Formula/minka.rb
          if grep -n '{{' tap/Formula/minka.rb; then
            echo "::error::The formula still has placeholders"
            exit 1
          fi
          ruby -c tap/Formula/minka.rb
      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "Flownative Bot"
          git config user.email "ops@flownative.com"
          git add Formula/minka.rb
          if git diff --cached --quiet; then
            echo "The formula already points at $VERSION."
            exit 0
          fi
          git commit -m "minka $VERSION"
          git push

  announce:
    name: Tell Minka the new version
    # Only once Homebrew offers it: Minka's update notice says `brew upgrade
    # minka`, and Minka takes only stable versions.
    needs: [build, tap]
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      # The release is out either way; a version Minka does not know yet only
      # delays its update notice, so this warns instead of failing.
      - name: Report the version to Minka
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MINKA_CLI_VERSION_TOKEN: ${{ secrets.MINKA_CLI_VERSION_TOKEN }}
        run: |
          catch_up="Until Minka knows it, its update notice names the previous version. To catch up, run ./flow cliversion:set --latest $VERSION on Minka, or re-run this job (within 30 days)."
          if [ -z "$MINKA_CLI_VERSION_TOKEN" ]; then
            echo "::warning::The secret MINKA_CLI_VERSION_TOKEN is missing in the environment 'release', so Minka was not told about minka $VERSION. $catch_up"
            exit 0
          fi
          # The token reaches curl on stdin, so it never stands in a command line.
          status="$(printf 'header = "Authorization: Bearer %s"\n' "$MINKA_CLI_VERSION_TOKEN" \
            | curl --config - --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
              --request PUT --header 'Content-Type: application/json' \
              --data "{\"latest\": \"$VERSION\"}" \
              https://minka.flownative.com/api/v1/operations/cli-version)" || true
          if [[ "$status" != 2?? ]]; then
            echo "::warning::Minka did not take minka $VERSION as its latest version (HTTP ${status:-000}). $catch_up"
            exit 0
          fi
          echo "Minka names minka $VERSION as its latest version."
